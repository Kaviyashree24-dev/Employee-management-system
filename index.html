<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Employee Management System</h1>
</header>

<main>
  <section class="controls">
    <input type="text" id="searchInput" placeholder="Search by name or email...">
    <select id="departmentFilter">
      <option value="">All Departments</option>
      <option value="HR">HR</option>
      <option value="IT">IT</option>
      <option value="Sales">Sales</option>
      <option value="Finance">Finance</option>
      <option value="Operations">Operations</option>
    </select>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
    <button id="addNewBtn">+ Add Employee</button>
  </section>

  <div id="messageBox" class="message-box hidden"></div>

  <section class="table-wrapper">
    <table id="employeeTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Joined</th>
          <th>Salary</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
        <!-- rows injected by JS -->
      </tbody>
    </table>
    <p id="emptyState" class="empty-state hidden">No employees found.</p>
  </section>
</main>

<!-- Add / Edit Modal -->
<div id="employeeModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Add Employee</h2>
    <form id="employeeForm">
      <input type="hidden" id="employeeId">

      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="phoneNumber">Phone Number</label>
      <input type="text" id="phoneNumber" required>

      <label for="department">Department</label>
      <select id="department" required>
        <option value="HR">HR</option>
        <option value="IT">IT</option>
        <option value="Sales">Sales</option>
        <option value="Finance">Finance</option>
        <option value="Operations">Operations</option>
      </select>

      <label for="designation">Designation</label>
      <input type="text" id="designation" required>

      <label for="dateOfJoining">Date of Joining</label>
      <input type="date" id="dateOfJoining" required>

      <label for="salary">Salary</label>
      <input type="number" id="salary" min="1" step="0.01" required>

      <label for="status">Status</label>
      <select id="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

      <div id="formError" class="form-error hidden"></div>

      <div class="modal-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal hidden">
  <div class="modal-content small">
    <h2>Delete Employee</h2>
    <p id="deleteConfirmText">Are you sure you want to delete this employee?</p>
    <div class="modal-actions">
      <button type="button" id="cancelDeleteBtn">Cancel</button>
      <button type="button" id="confirmDeleteBtn" class="danger">Delete</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
